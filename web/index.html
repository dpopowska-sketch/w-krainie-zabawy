<!doctype html>
<html lang="pl" data-theme="nowoczesny">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F7F8" />
    <meta name="description" content="Plan przedszkolaka – grupa Wilczki" />
    <title>Plan przedszkolaka – grupa Wilczki</title>
    <link rel="icon" type="image/svg+xml" href="./wilczek.svg" />
    <script>
      // Wygląd przed pierwszym renderem, żeby nie mignął zły (klucz jak w src/theme.ts).
      try {
        var t = localStorage.getItem("wygladStrony");
        if (t === "nowoczesny" || t === "przyjazny") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Ta strona wymaga włączonej obsługi JavaScript.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
