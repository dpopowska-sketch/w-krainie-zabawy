# Ręczne decyzje dla pozycji „do weryfikacji”.
#
# Lista pozycji z gotowymi fragmentami do skopiowania jest w review/pending.md.
# Plik można edytować bezpośrednio na GitHubie (ikona ołówka). Zmiany pojawią się
# na stronie przy najbliższej synchronizacji.
#
# Dostępne decyzje:
#
#   - id: <identyfikator terminu>
#     action: confirm          # termin jest poprawny, pokaż jako zweryfikowany
#     note: "sprawdzone z sekretariatem"   # opcjonalnie
#
#   - id: <identyfikator terminu>
#     action: hide             # błędny odczyt, nie pokazuj
#
#   - id: <identyfikator terminu>
#     action: edit             # popraw wartości (tylko te, które podasz)
#     set:
#       date: "2026-10-13"
#       start: "07:30"
#       end: "08:30"
#
#   - notice: <identyfikator komunikatu>
#     action: dismiss          # ukryj komunikat bez dopasowania
#
#   - event: <identyfikator wydarzenia przedszkolnego>
#     action: confirm          # opublikuj mimo wątpliwości (albo: hide – nie pokazuj)
#
#   - id: <własny identyfikator, np. test-1>
#     action: add            # dodaj termin spoza tabeli (np. próba kalendarza w telefonie)
#     set:
#       group: wilczki
#       activity: "Test"
#       date: "2026-11-12"
#       start: "10:00"
#       end: "11:00"
#
#   - event: <identyfikator wydarzenia przedszkolnego>
#     action: edit             # popraw i opublikuj
#     set:
#       date: "2026-11-12"
#       title: "Zebranie z rodzicami"

decisions:
  # Próba „Kalendarz w telefonie” (2026-11-08) – usunąć po teście.
  - id: test-kalendarza
    action: add
    set:
      group: wilczki
      activity: "Test"
      date: "2026-11-12"
      start: "10:00"
      end: "11:00"
    note: "próba subskrypcji kalendarza"
  - id: test-kalendarza
    action: edit
    set:
      date: "2026-11-13"
      status: rescheduled
    note: "próba – przeniesienie na piątek"
