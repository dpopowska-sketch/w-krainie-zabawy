name: Synchronizacja harmonogramu

on:
  schedule:
    # Sprawdzenia co godzinę od 7:00 do 17:00 czasu polskiego. Cron działa w UTC, więc są dwa
    # komplety godzin, a zadanie „czas” przepuszcza tylko ten pasujący do obecnej pory roku.
    # GitHub może uruchomić zadanie z opóźnieniem (zwykle do godziny).
    - cron: "0 6-16 * * *" # zima (UTC+1): 7:00–17:00
    - cron: "0 5-15 * * *" # lato (UTC+2): 7:00–17:00
  workflow_dispatch: # przycisk „Run workflow” w zakładce Actions
  push:
    branches: [main] # zapisana decyzja lub zmiana strony → od razu nowa wersja

permissions:
  contents: write # zapis danych w repozytorium
  pages: write # publikacja strony
  issues: write # powiadomienia o pozycjach do rozstrzygnięcia
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  # Przy uruchomieniu z harmonogramu: czy ten cron jest dla obecnej pory roku (zima/lato w Polsce)?
  # Liczy się, który cron uruchomił zadanie, a nie godzina startu – opóźnienie GitHuba nie przeszkadza.
  czas:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          case "${{ github.event.schedule }}" in
            "") run=true ;;
            "0 6-16 * * *") [ "$(TZ=Europe/Warsaw date +%z)" = "+0100" ] && run=true || run=false ;;
            *) [ "$(TZ=Europe/Warsaw date +%z)" = "+0200" ] && run=true || run=false ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"

  sync:
    needs: czas
    if: needs.czas.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # Zawsze najnowszy kod z main – także przy „Re-run” starego uruchomienia,
      # który inaczej opublikowałby z powrotem starą wersję strony.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Synchronizacja
        id: sync
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zgłoszenia (issues) → mail od GitHuba
        run: npm run sync

      - name: Zapis zmian w repozytorium
        id: commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data review history
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Brak zmian."
            exit 0
          fi
          if git diff --cached --quiet -- . ':(exclude)data/status.json'; then
            # Zmienił się tylko status. Zapisujemy go, gdy pojawił się lub zniknął błąd (rodzice widzą wtedy
            # ostrzeżenie albo przestają je widzieć), a sam czas sprawdzenia – najwyżej raz dziennie.
            strip='del(.lastChecked, .lastSuccess)'
            before=$(git show HEAD:data/status.json 2>/dev/null | jq -S "$strip" || echo '{}')
            after=$(jq -S "$strip" data/status.json)
            last=$(git show HEAD:data/status.json 2>/dev/null | jq -r '.lastChecked // "" | .[0:10]')
            if [ "$before" = "$after" ] && [ "$last" = "$(date -u +%F)" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Tylko czas sprawdzenia, już zapisany dzisiaj."
              exit 0
            fi
          fi
          git commit -m "Synchronizacja $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Ktoś mógł w międzyczasie zapisać decyzję w repozytorium.
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Zgłoszenie błędu synchronizacji
        if: steps.sync.outcome == 'failure' || steps.commit.outcome == 'failure'
        run: |
          echo "::error::Synchronizacja lub zapis zakończyły się błędem – szczegóły w krokach powyżej i w data/status.json"
          exit 1

  # Tylko gdy coś się zmieniło: dane, błąd synchronizacji (ostrzeżenie dla rodziców) albo raz dziennie czas
  # sprawdzenia; po zmianie w repozytorium i ręcznym uruchomieniu – zawsze. Także po błędzie synchronizacji.
  # Publikacja strony – osobne zadanie ze wspólną kolejką „pages” (także dla menu.yml), więc dwie publikacje
  # nigdy nie ruszają naraz. Strona jest budowana z najnowszego main, dlatego pominięcie starszej publikacji
  # czekającej w kolejce niczego nie gubi.
  strona:
    needs: sync
    if: ${{ !cancelled() && needs.sync.result != 'skipped' && (needs.sync.outputs.changed == 'true' || github.event_name != 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Budowanie strony
        run: npm run web:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publikacja strony
        id: deploy
        uses: actions/deploy-pages@v4

      # Okres próbny: ta sama strona trafia też na Cloudflare Pages (docelowe miejsce, repo będzie prywatne).
      # Projekt zakłada się sam przy pierwszej publikacji. Błąd tutaj nie blokuje GitHub Pages.
      - name: Publikacja na Cloudflare
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list | grep -qw wilczki-kalendarz \
            || npx --yes wrangler@4 pages project create wilczki-kalendarz --production-branch=main
          npx --yes wrangler@4 pages deploy dist --project-name=wilczki-kalendarz --branch=main --commit-dirty=true
