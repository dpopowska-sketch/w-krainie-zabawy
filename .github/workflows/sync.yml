name: Synchronizacja harmonogramu

on:
  schedule:
    # Czas UTC: 4:15 i 14:15 = 5:15 i 15:15 zimą / 6:15 i 16:15 latem w Polsce.
    # GitHub może uruchomić zadanie z kilkunastominutowym opóźnieniem.
    - cron: "15 4,14 * * *"
  workflow_dispatch: # przycisk „Run workflow” w zakładce Actions
  push:
    branches: [main] # zapisana decyzja lub zmiana strony → od razu nowa wersja

permissions:
  contents: write # zapis danych w repozytorium
  pages: write # publikacja strony
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Zawsze najnowszy kod z main – także przy „Re-run” starego uruchomienia,
      # który inaczej opublikowałby z powrotem starą wersję strony.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Synchronizacja
        id: sync
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run sync

      - name: Zapis zmian w repozytorium
        id: commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data review
          if git diff --cached --quiet; then
            echo "Brak zmian."
            exit 0
          fi
          if git diff --cached --quiet -- . ':(exclude)data/status.json'; then
            # Zmienił się tylko czas sprawdzenia – zapisujemy go najwyżej raz dziennie.
            last=$(git show HEAD:data/status.json 2>/dev/null | jq -r '.lastChecked // "" | .[0:10]')
            if [ "$last" = "$(date -u +%F)" ] && [ "${{ steps.sync.outcome }}" = "success" ]; then
              echo "Tylko status, już zapisany dzisiaj."
              exit 0
            fi
          fi
          git commit -m "Synchronizacja $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Ktoś mógł w międzyczasie zapisać decyzję w repozytorium.
          git pull --rebase
          git push

      # Strona jest publikowana zawsze – także po błędzie synchronizacji
      # (wtedy z ostatnimi sprawdzonymi danymi i ostrzeżeniem dla rodziców).
      - name: Budowanie strony
        run: npm run web:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publikacja strony
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Zgłoszenie błędu synchronizacji
        if: steps.sync.outcome == 'failure' || steps.commit.outcome == 'failure'
        run: |
          echo "::error::Synchronizacja lub zapis zakończyły się błędem – szczegóły w krokach powyżej i w data/status.json"
          exit 1
